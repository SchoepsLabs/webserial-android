name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The JS suite loads the shipped polyfill into a vm context, so it fails
      # if the asset the APK actually injects drifts from what the tests pin.
      - name: JS bridge tests
        run: node --test "js-tests/**/*.test.mjs"

      - name: Kotlin unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
